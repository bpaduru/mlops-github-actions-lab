name: Testing with Pytest
run-name: Pytest run by ${{ github.actor }}

on:
  push:
    branches:
      - main
      - 'releases/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # run the tests on 3 python versions to make sure it works on all of them
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run tests and generate XML report
      run: pytest -v --junitxml=pytest-report.xml
      continue-on-error: false

    - name: Run grade report on student data
      run: python -m src.grade_stats

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.python-version }}
        path: pytest-report.xml

    - name: Notify on success
      if: success()
      run: echo "Tests passed successfully on Python ${{ matrix.python-version }}"

    - name: Notify on failure
      if: failure()
      run: echo "Tests failed on Python ${{ matrix.python-version }}"
