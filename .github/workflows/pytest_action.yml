name: Testing with Pytest
run-name: Pytest run by ${{ github.actor }}

on:
  push:
    branches:
      - main
      - 'releases/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # run the tests on 3 python versions to make sure it works on all of them
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        # caches pip downloads so later runs install faster
        cache: 'pip'

    - name: Install dependencies
      run: pip install -r requirements.txt

    # build fails if coverage of the src folder is under 80 percent
    - name: Run tests with coverage check
      run: pytest -v --cov=src --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=80 --junitxml=pytest-report.xml

    - name: Run grade report on student data
      run: python -m src.grade_stats

    - name: Upload test and coverage results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          pytest-report.xml
          coverage.xml

    - name: Notify on success
      if: success()
      run: echo "Tests passed successfully on Python ${{ matrix.python-version }}"

    - name: Notify on failure
      if: failure()
      run: echo "Tests or coverage check failed on Python ${{ matrix.python-version }}"
